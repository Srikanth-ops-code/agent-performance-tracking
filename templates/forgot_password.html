{% extends "base.html" %}
{% block title %}Forgot Password · Daily Tracker{% endblock %}
{% block content %}
<div class="login-wrap"><div class="login-card">
  <span class="eyebrow">ACCOUNT RECOVERY</span>
  <h1>Forgot password?</h1>
  <p class="muted">Enter the verified Gmail address linked to your agent account. We’ll send a one-time code if it matches.</p>
  <form method="post" class="stack-form">
    <label>Verified Gmail address<input type="email" name="email" placeholder="yourname@gmail.com" autocomplete="email" required></label>
    <button class="button full">Send reset code</button>
  </form>
  <p><a href="{{ url_for('login') }}">Back to sign in</a></p>
</div></div>
{% endblock %}
